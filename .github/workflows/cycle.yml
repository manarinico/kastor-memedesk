# One paper-trading cycle per run (PAPER ONLY: no wallets, no keys, no secrets, no real orders).
# State lives on the orphan branch `state` (one commit, force-pushed each run).
# GitHub cron is best-effort: runs can start 5-30+ min late or be skipped under load. Late or
# missed slots are NOT backfilled; they show as gaps in cycles.started_at.
name: desk cycle

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: desk
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York
      MEMEDESK_HOST: github-actions
      STATE_HOST: github-actions
      PYTHONUNBUFFERED: "1"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      start: ${{ steps.t0.outputs.start }}
    steps:
      - name: Record start time
        id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state (fail closed)
        id: restore
        run: |
          set -euo pipefail
          if ! git fetch --depth 1 origin +refs/heads/state:refs/remotes/origin/state; then
            echo "::error::could not fetch the 'state' branch - refusing to run on an empty DB"; exit 1
          fi
          mkdir -p data
          git cat-file blob origin/state:memedesk.sqlite.gz | gunzip > data/memedesk.sqlite \
            || { echo "::error::state DB restore/gunzip failed - refusing to run"; exit 1; }
          git cat-file blob origin/state:cron.log > data/cron.log 2>/dev/null || : > data/cron.log
          python scripts/state_tool.py check data/memedesk.sqlite
          echo "lease=$(git rev-parse origin/state)" >> "$GITHUB_OUTPUT"
          echo "restored: $(python scripts/state_tool.py info data/memedesk.sqlite)"

      - name: Run one cycle (same entry as run_loop.sh)
        id: cycle
        run: |
          set +e
          echo "[$(date '+%Y-%m-%d %H:%M:%S %Z')] loop: cycle start (host github-actions, run $RUN_URL, event ${{ github.event_name }})" >> data/cron.log
          timeout -k 30 450 python -m memedesk run_cycle
          rc=$?
          case $rc in 0) note=ok;; 124) note="KILLED: hit the 450s timeout";; 137) note="KILLED: SIGKILL after timeout";; *) note=FAILED;; esac
          echo "[$(date '+%Y-%m-%d %H:%M:%S %Z')] loop: cycle end rc=$rc $note (host github-actions)" >> data/cron.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write report
        run: |
          python -m memedesk report > data/report_latest.txt || echo "::warning::report failed (state is still saved)"
          cat data/report_latest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify integrity
        run: python scripts/state_tool.py check data/memedesk.sqlite

      - name: Push new state
        run: scripts/push_state.sh data "${{ steps.restore.outputs.lease }}"

      - name: Fail the run if the cycle failed (state with the failed cycle row was still saved)
        if: steps.cycle.outputs.rc != '0'
        run: |
          echo "::error::run_cycle exited ${{ steps.cycle.outputs.rc }}"; tail -40 data/cron.log; exit 1

  # Self-chain: GitHub cron is best-effort, so each run starts the next one ~20 min after it began.
  # Cron above stays as a backup if the chain breaks. Skips if another run is already queued/running.
  chain:
    needs: cycle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait out the 20-minute interval, then dispatch the next cycle
        run: |
          set -euo pipefail
          start="${{ needs.cycle.outputs.start }}"; [ -n "$start" ] || start=$(date +%s)
          wait=$(( start + 1200 - $(date +%s) )); [ "$wait" -gt 0 ] && sleep "$wait" || true
          others=$(gh run list -R "$REPO" -w "desk cycle" -L 10 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\" or .status==\"requested\")] | length")
          if [ "$others" -gt 0 ]; then echo "another run is queued/running ($others); not chaining"; exit 0; fi
          gh workflow run "desk cycle" -R "$REPO" --ref "${{ github.ref_name }}"
          echo "dispatched next cycle"
